name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
      - run: tar --format=ustar -czf theme.tar.gz dist theme.json
      - run: sha256sum theme.tar.gz | cut -d' ' -f1 | tee theme.tar.gz.sha256
      - if: startsWith(github.ref, 'refs/tags/')
        run: |
          gh release upload "$GITHUB_REF_NAME" theme.tar.gz theme.tar.gz.sha256 --repo "$GITHUB_REPOSITORY" || \
          gh release create "$GITHUB_REF_NAME" theme.tar.gz theme.tar.gz.sha256 --generate-notes --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
