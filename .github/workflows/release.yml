name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
      - name: Pack theme
        run: |
          FILES="dist theme.json"
          [ -f preview.png ] && FILES="$FILES preview.png"
          tar --format=ustar -czf theme.tar.gz $FILES
      - run: sha256sum theme.tar.gz | cut -d' ' -f1 | tee theme.tar.gz.sha256
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          ASSETS="theme.tar.gz theme.tar.gz.sha256"
          [ -f preview.png ] && ASSETS="$ASSETS preview.png"
          gh release upload "$GITHUB_REF_NAME" $ASSETS --repo "$GITHUB_REPOSITORY" --clobber || \
          gh release create "$GITHUB_REF_NAME" $ASSETS --generate-notes --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
